<script>window.TIMELINE = {"course": "Cyber Vault", "section": "What the vault is", "title": "The vault and the Deployable Architecture are different products", "unit": "m1-u4-two-products-one-name.html", "sketches": {"start": {"w": 490, "h": 340, "shapes": [{"box": [10, 10, 360, 140], "title": "Cyber Vault", "heavy": true}, {"box": [120, 200, 360, 130], "title": "Deployable Architecture", "dashed": true}]}, "side": {"w": 900, "h": 360, "shapes": [{"box": [20, 30, 400, 130], "title": "IBM Cloud Cyber Vault", "detail": "one create call", "heavy": true}, {"box": [20, 220, 400, 100], "title": "two keys"}, {"box": [480, 30, 400, 130], "title": "Deployable Architecture", "detail": "Terraform", "dashed": true}, {"box": [480, 220, 400, 100], "title": "one HMAC key", "dashed": true}]}, "locks": {"w": 900, "h": 300, "shapes": [{"box": [20, 40, 400, 200], "title": "Cyber Vault", "detail": "0 to 3,650 days", "heavy": true}, {"box": [480, 40, 400, 200], "title": "Deployable Architecture", "detail": "1 to 1,000 years", "dashed": true}]}, "sum": {"w": 340, "h": 320, "shapes": [{"box": [10, 20, 320, 120], "title": "IBM Cloud Cyber Vault", "heavy": true}, {"box": [10, 190, 320, 100], "title": "Deployable Architecture", "dashed": true}]}}, "steps": [{"title": "Welcome", "cues": [{"slide": {"type": "title", "head": "Two products with similar names", "sub": "Tell the vault from the Deployable Architecture", "sketch": "start"}, "say": "This module is about two IBM products with similar names.", "do": [["show", "head"]], "hold": 0.6, "dur": 3.47, "audio": "audio/ba25717397f14fb5.mp3"}, {"say": "By the end, you'll be able to name both products, say which one this course teaches, and use the right name in a paper for Northgate's directors.", "do": [["show", "sub"]], "dur": 7.32, "audio": "audio/ca3d06c90b4efeb0.mp3"}, {"say": "Northgate Freight is the made-up haulier we're following. It backs up with Defender Data Protect.", "do": [["build", [0]]], "dur": 5.27, "audio": "audio/abdf68ec0f194845.mp3"}, {"say": "A colleague sends Northgate's backup admin a link that says cyber vault. Before using anything on it, the admin needs to work out which of two IBM products the link is about.", "do": [["build", [1]]], "hold": 0.8, "dur": 9.42, "audio": "audio/98c8d36b31201b07.mp3"}, {"say": "Let's start with three terms.", "hold": 1.0, "dur": 1.77, "audio": "audio/1fea2abf4a1bdb98.mp3"}]}, {"title": "Two products side by side", "cues": [{"slide": {"type": "words", "head": "Words in this module", "items": [["Terraform", "a tool that builds cloud resources from written instructions"], ["HMAC key", "an access key ID and secret key for object storage"], ["Deployable Architecture", "a Terraform architecture in the IBM Cloud catalog"]]}, "say": "You'll hear these all through this module.", "do": [["show", "head"]], "hold": 0.4, "dur": 2.0, "audio": "audio/7c1c5eba03028fc4.mp3"}, {"say": "Terraform is a tool that builds cloud resources from written instructions.", "do": [["items", [0]]], "hold": 0.6, "dur": 4.3, "audio": "audio/5ab815a23aff1bda.mp3"}, {"say": "An HMAC key is a pair of an access key ID and a secret key that object storage accepts for requests.", "do": [["items", [1]]], "hold": 0.6, "dur": 6.7, "audio": "audio/fa7a85e7ddee3f8c.mp3"}, {"say": "And the Deployable Architecture is a Terraform architecture in the IBM Cloud catalog.", "do": [["items", [2]]], "hold": 1.0, "dur": 5.17, "audio": "audio/11472741fcdd9095.mp3"}, {"slide": {"type": "diagram", "head": "Built in different ways", "sketch": "side"}, "say": "Both products give you a cyber vault for backups, but they're different products, and each is put together differently.", "do": [["show", "head"]], "hold": 0.4, "dur": 5.7, "audio": "audio/7915397741ef36d4.mp3"}, {"say": "IBM's docs describe IBM Cloud Cyber Vault as a managed feature of Cloud Object Storage. One call creates a hardened bucket, with credentials and network rules.", "do": [["build", [0]]], "hold": 0.6, "dur": 10.15, "audio": "audio/433800734cd4c634.mp3"}, {"say": "It comes with two keys, one for writing and one for reading, and the vault sits in an account that IBM manages.", "do": [["build", [1]]], "hold": 0.6, "dur": 6.47, "audio": "audio/16b7615a00dddcb4.mp3"}, {"say": "The Deployable Architecture is called COS Cyber Vault for Storage Defender. It's a Terraform architecture that builds ordinary resources in the customer's own account.", "do": [["build", [2]]], "hold": 0.6, "dur": 9.05, "audio": "audio/5d4ab1789840bf9f.mp3"}, {"say": "And it uses one HMAC key.", "do": [["build", [3]]], "hold": 1.2, "dur": 2.5, "audio": "audio/1e105b9c1af7fc97.mp3"}]}, {"title": "Days or years", "cues": [{"slide": {"type": "q", "head": "Which product has a lock of 0 to 3,650 days?", "opts": ["IBM Cloud Cyber Vault", "The Deployable Architecture"], "ok": 0, "why": "Cyber Vault's lock is set in days, and the architecture's in years."}, "say": "Each product has its own lock default. Which product has a lock of 0 to 3,650 days, where 0 means the backup software locks each object?", "do": [["ask"]], "dur": 9.45, "audio": "audio/ee0ec9f5d3842fb9.mp3"}, {"say": "IBM Cloud Cyber Vault. Its lock is set in days, and the architecture's in years.", "do": [["why"]], "hold": 1.5, "dur": 4.87, "audio": "audio/96409f3e557eecf1.mp3"}, {"slide": {"type": "diagram", "head": "The lock is set in days or years", "sketch": "locks"}, "say": "So Cyber Vault takes 0 to 3,650 days.", "do": [["show", "head"], ["build", [0]]], "hold": 0.6, "dur": 4.35, "audio": "audio/024df9f7fbecc8b8.mp3"}, {"say": "The Deployable Architecture's lock default, when the lock is on, is 1 to 1,000 years.", "do": [["build", [1]]], "hold": 1.0, "dur": 5.42, "audio": "audio/dbe654d956b0c2ac.mp3"}, {"say": "A colleague at Northgate writes in a summary: We tested the cyber vault, so we know the lock default is at least one year.", "dur": 6.2, "audio": "audio/2b1153a516998dfc.mp3"}, {"say": "That sentence mixes the two products. The one-year minimum belongs to the Deployable Architecture, and Cyber Vault takes 0 to 3,650 days.", "hold": 1.2, "dur": 9.52, "audio": "audio/ed72390f4900dfa6.mp3"}]}, {"title": "The right name", "cues": [{"slide": {"type": "q", "head": "Which name should Northgate's paper use?", "opts": ["Just \"Cyber Vault\"", "IBM Cloud Cyber Vault", "The Deployable Architecture's name"], "ok": 1, "why": "You'll also see it written IBM COS Cyber Vault."}, "say": "Northgate's backup admin is writing about the vault for the directors. Which name should the paper use?", "do": [["ask"]], "dur": 5.6, "audio": "audio/efe3b298bf1eefd8.mp3"}, {"say": "IBM Cloud Cyber Vault. You'll also see it written IBM COS Cyber Vault.", "do": [["why"]], "hold": 1.5, "dur": 4.72, "audio": "audio/9ea13129f3180a50.mp3"}, {"slide": {"type": "tip", "head": "Cyber vault can mean either product", "tip": "Check which product a number belongs to."}, "say": "Watch for this. When a page or a colleague says only cyber vault, they could mean either product. So ask which one before you reuse any number.", "do": [["show", "head"], ["show", "tip"]], "hold": 2.0, "dur": 7.45, "audio": "audio/73266cf8c1d5b027.mp3"}]}, {"title": "Check yourself", "cues": [{"slide": {"type": "statement", "head": "Three quick questions"}, "say": "Now three quick questions to check what you've learned.", "do": [["show", "head"]], "hold": 0.6, "dur": 2.92, "audio": "audio/6751b89b1110a0d2.mp3"}, {"slide": {"type": "q", "check": true, "head": "Which product does this course teach?", "opts": ["IBM Cloud Cyber Vault", "The Deployable Architecture", "Both"], "ok": 0, "why": "The Deployable Architecture is a different product."}, "say": "First, which product does this course teach?", "do": [["ask"]], "dur": 2.47, "audio": "audio/ec9160275cd4c857.mp3"}, {"say": "IBM Cloud Cyber Vault. The Deployable Architecture is a different product.", "do": [["why"]], "hold": 1.5, "dur": 4.72, "audio": "audio/eecc2c7240e2c73d.mp3"}, {"slide": {"type": "q", "check": true, "head": "A link describes a Terraform architecture. Which product?", "opts": ["IBM Cloud Cyber Vault", "The Deployable Architecture", "Neither"], "ok": 1, "why": "Cyber Vault is made by one call, not by Terraform."}, "say": "Second, a link says cyber vault, and describes a Terraform architecture from the IBM Cloud catalog. Which product is it about?", "do": [["ask"]], "dur": 7.67, "audio": "audio/9ad3634949bdf9f9.mp3"}, {"say": "The Deployable Architecture. IBM Cloud Cyber Vault is a managed feature made by one call, not a Terraform architecture.", "do": [["why"]], "hold": 1.5, "dur": 7.55, "audio": "audio/c1fd0dfd34d18cf0.mp3"}, {"slide": {"type": "q", "check": true, "head": "How does the Deployable Architecture get made?", "opts": ["By one create call", "By Terraform, in your account", "By a support case"], "ok": 1, "why": "IBM describes it as Terraform from the IBM Cloud catalog."}, "say": "And third, how does the Deployable Architecture get made?", "do": [["ask"]], "dur": 3.35, "audio": "audio/60a43195b7aab81a.mp3"}, {"say": "By Terraform, from the IBM Cloud catalog, building ordinary resources in your account. That's how IBM describes it.", "do": [["why"]], "hold": 1.5, "dur": 6.8, "audio": "audio/aa36c6ad524d77a1.mp3"}]}, {"title": "Summary", "cues": [{"slide": {"type": "score"}, "say": "That's the module done. Here's your score.", "do": [["show", "head"]], "hold": 1.5, "dur": 2.5, "audio": "audio/09491c03af65ff4a.mp3"}, {"slide": {"type": "summary", "text": "\u003cem\u003eIBM Cloud Cyber Vault\u003c/em\u003e is the product this course teaches.", "next": "Next: Get access", "sketch": "sum"}, "say": "If you remember one thing, make it this. This course teaches IBM Cloud Cyber Vault, and the Deployable Architecture is a different product. Whenever a source says only cyber vault, ask which one it means.", "do": [["show", "head"], ["build", [0, 1]]], "hold": 1.5, "dur": 11.1, "audio": "audio/9c40becd1663f8c3.mp3"}, {"say": "In the next module, you'll see what an account needs before it
