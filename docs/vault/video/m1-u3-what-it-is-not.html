<script>window.TIMELINE = {"course": "Cyber Vault", "section": "What the vault is", "title": "What it isn't: logical isolation and no physical air gap", "unit": "m1-u3-what-it-is-not.html", "pronounce": {"read": "reed"}, "sketches": {"start": {"w": 490, "h": 340, "shapes": [{"box": [10, 10, 320, 160], "title": "vault", "detail": "rules, locks", "heavy": true}, {"box": [170, 210, 310, 120], "title": "air gap", "detail": "no", "dashed": true}]}, "apart": {"w": 900, "h": 400, "shapes": [{"box": [560, 40, 320, 260], "title": "vault", "heavy": true}, {"box": [20, 40, 340, 100], "title": "allowed VPC", "detail": "VSI"}, {"line": [364, 90, 556, 110], "arrow": true}, {"text": "200", "at": [440, 80], "hand": true}, {"box": [20, 240, 340, 100], "title": "everyone else", "detail": "valid key", "dashed": true}, {"line": [364, 290, 556, 250], "arrow": true}, {"text": "403", "at": [440, 300], "hand": true}, {"text": "IBM-managed account", "at": [570, 350], "hand": true}]}, "banner": {"w": 900, "h": 380, "shapes": [{"box": [20, 20, 860, 150], "title": "banner", "detail": "air-gapped, virtual air-gap isolation", "heavy": true}, {"box": [20, 240, 860, 120], "title": "Location", "detail": "cloud region"}]}, "lists": {"w": 900, "h": 320, "shapes": [{"box": [20, 40, 400, 200], "title": "vault allow-list", "detail": "which networks", "heavy": true}, {"box": [480, 40, 400, 200], "title": "IBM's list", "detail": "which accounts can create"}]}, "claim": {"w": 900, "h": 300, "shapes": [{"box": [20, 40, 400, 200], "title": "air-gapped", "detail": "logical isolation", "dashed": true}, {"box": [480, 40, 400, 200], "title": "who touched it", "detail": "audit events", "dashed": true}]}, "sum": {"w": 340, "h": 320, "shapes": [{"box": [10, 20, 320, 120], "title": "vault", "detail": "rules and locks", "heavy": true}, {"box": [10, 190, 320, 120], "title": "air gap", "detail": "no", "dashed": true}]}}, "steps": [{"title": "Welcome", "cues": [{"slide": {"type": "title", "head": "What it isn't", "sub": "Logical isolation, not an air gap, and what an account needs", "sketch": "start"}, "say": "This module is about what the Cyber Vault isn't.", "do": [["show", "head"]], "hold": 0.6, "dur": 2.67, "audio": "audio/410b4cb54a0fba9f.mp3"}, {"say": "By the end, you'll be able to explain what isolated means for this vault, why it isn't a physical air gap, and what an account needs before it can create a vault.", "do": [["show", "sub"]], "dur": 7.95, "audio": "audio/0b6966db636dae5e.mp3"}, {"say": "We're following Northgate Freight, a made-up haulier that backs up with Defender Data Protect. Northgate's directors have heard the words air gap.", "do": [["build", [0]]], "dur": 7.42, "audio": "audio/8e5bb5af8c97c629.mp3"}, {"say": "Before Northgate's IT manager uses those words, the manager needs to know exactly what the vault does.", "do": [["build", [1]]], "hold": 0.8, "dur": 5.6, "audio": "audio/ccca524705bf0f7e.mp3"}, {"say": "Let's start with some words.", "hold": 1.0, "dur": 1.57, "audio": "audio/bae6d762af2270eb.mp3"}]}, {"title": "What keeps the vault apart", "cues": [{"slide": {"type": "words", "head": "Words in this module", "items": [["COS", "short for IBM Cloud Object Storage"], ["VSI", "a virtual server in IBM Cloud"], ["audit events", "records of who made which request to a service"], ["Deployable Architecture", "a ready-made catalog package that builds resources in your account"]]}, "say": "Here are four terms you'll hear.", "do": [["show", "head"]], "hold": 0.4, "dur": 1.62, "audio": "audio/d49640afd6793f1b.mp3"}, {"say": "COS is short for IBM Cloud Object Storage. A COS instance is one copy of that service in an account.", "do": [["items", [0]]], "hold": 0.6, "dur": 6.22, "audio": "audio/9ef6905cb2ed5f90.mp3"}, {"say": "A VSI is a virtual server instance: a virtual server in IBM Cloud.", "do": [["items", [1]]], "hold": 0.6, "dur": 4.62, "audio": "audio/5c149a8014e1c99b.mp3"}, {"say": "Audit events are records of who made which request to a service.", "do": [["items", [2]]], "hold": 0.6, "dur": 3.12, "audio": "audio/9585d657ee21942e.mp3"}, {"say": "And a Deployable Architecture is a ready-made package in the IBM Cloud catalog that builds a set of cloud resources in your account.", "do": [["items", [3]]], "hold": 1.0, "dur": 7.37, "audio": "audio/f76e02e668b177e7.mp3"}, {"slide": {"type": "diagram", "head": "The vault answers only its allowed networks", "sketch": "apart"}, "say": "The vault is isolated by network rules and by locks. It's still a bucket in a cloud region.", "do": [["show", "head"], ["build", [0]]], "hold": 0.6, "dur": 5.65, "audio": "audio/d65670aa3a0452ce.mp3"}, {"say": "The networks on its allow-list reach it in the normal way. A control request from a VSI inside the allowed VPC got HTTP 200.", "do": [["build", [1, 2, 3]]], "hold": 0.6, "dur": 8.8, "audio": "audio/903bd24574eded0a.mp3"}, {"say": "Everyone else got HTTP 403, even with a valid key. That's what logical isolation means here.", "do": [["build", [4, 5, 6]]], "hold": 0.8, "dur": 6.6, "audio": "audio/91e3fe1b6fee0711.mp3"}, {"say": "The bucket itself sits in an account that IBM manages. It wasn't in the bucket list of the account's own COS instance, and asking for its configuration gave the account owner 403.", "do": [["build", [7]]], "hold": 1.2, "dur": 10.97, "audio": "audio/446fdf3d6b31e169.mp3"}]}, {"title": "The words on the console page", "cues": [{"slide": {"type": "diagram", "head": "The console page says air-gapped", "sketch": "banner"}, "say": "The Cyber Vault console page uses the word air-gapped.", "do": [["show", "head"]], "dur": 3.35, "audio": "audio/f33676aedb52191f.mp3"}, {"say": "Its banner calls the vault a managed air-gapped S3 compatible storage solution, with virtual air-gap isolation.", "do": [["build", [0]]], "hold": 0.6, "dur": 7.2, "audio": "audio/8ede956e64084bcd.mp3"}, {"say": "Those words describe network rules and locks. The vault sits in a cloud region and is reached over the network, so what you have is logical isolation.", "hold": 0.6, "dur": 8.37, "audio": "audio/660fa9cc6f843775.mp3"}, {"say": "The Location column on the same page names the cloud region each vault is in.", "do": [["build", [1]]], "hold": 1.2, "dur": 4.52, "audio": "audio/23478762661dda81.mp3"}]}, {"title": "Networks and accounts", "cues": [{"slide": {"type": "diagram", "head": "Two lists decide who gets in", "sketch": "lists"}, "say": "Who gets in is decided by two lists.", "do": [["show", "head"]], "dur": 2.3, "audio": "audio/c007778fcdcef887.mp3"}, {"say": "The vault's own allow-list decides which networks can reach it. The network rules are checked before the key counts, so a stolen key from outside the allow-list gets nothing.", "do": [["build", [0]]], "hold": 0.6, "dur": 9.27, "audio": "audio/c6096be02ab77ee7.mp3"}, {"say": "IBM keeps a second list, which decides which accounts can create a vault.", "do": [["build", [1]]], "hold": 1.0, "dur": 4.25, "audio": "audio/8624ffdd396e04c5.mp3"}, {"slide": {"type": "q", "head": "What does a working list show?", "opts": ["The account may create vaults", "Only that the role works", "The service is down"], "ok": 1, "why": "Only a create shows whether IBM has allowed the account."}, "say": "Suppose an account can list vaults, but every create fails. What does a working list call show?", "do": [["ask"]], "dur": 5.35, "audio": "audio/1d68c2abfe0046d6.mp3"}, {"say": "Only that the role works. A list needs a role alone, and only a create shows whether the account is on IBM's list.", "do": [["why"]], "hold": 1.5, "dur": 6.17, "audio": "audio/94832597e266dc49.mp3"}, {"say": "One account had exactly this. Six creates went to failed in 17 to 40 seconds, with no error text. Later, a create went to active in about 30 seconds.", "hold": 0.6, "dur": 10.1, "audio": "audio/9fd3ebce93911e0e.mp3"}, {"say": "IBM didn't confirm the cause, and the most likely one is that the account wasn't yet on the list. On Basic support you can't open the onboarding case yourself, so ask IBM's Cyber Vault product team. They allow-list the account when asked.", "hold": 1.2, "dur": 12.7, "audio": "audio/74617c3b62dfeba5.mp3"}]}, {"title": "What Northgate tells the auditor", "cues": [{"slide": {"type": "statement", "head": "The IT manager's sentence for the auditor", "sketch": "claim"}, "say": "Northgate's IT manager wants to tell the auditor who checks Northgate's security controls: The vault is physically air-gapped, and the owner can show who touched it.", "do": [["show", "head"]], "hold": 0.6, "dur": 8.95, "audio": "audio/140db5b5d5a3a5e6.mp3"}, {"say": "The first part is wrong. The isolation is logical, not physical: network rules and locks keep the vault apart, and its allowed network can reach it.", "do": [["build", [0]]], "hold": 0.8, "dur": 8.9, "audio": "audio/2c33f172790563d7.mp3"}, {"say": "Then there's the last part.", "do": [["build", [1]]], "hold": 0.6, "dur": 1.47, "audio": "audio/eca062f675cd3aaf.mp3"}, {"slide": {"type": "q", "head": "Can the owner show who touched the vault?", "opts": ["Yes, all requests logged", "No, switching on got 403", "Only read events"], "ok": 1, "why": "Configuration calls got 403, and no vault events showed in the logs."}, "say": "Can the account owner show who touched the vault?", "do": [["ask"]], "dur": 2.45, "audio": "audio/b9d4a39bc75e594e.mp3"}, {"say": "No. When the owner tried to switch audit events on, the configuration calls returned 403. Of 4,346 events in one logs instance, none came from Cloud Object Storage, and a scan of a second instance found no vault event.", "do": [["why"]], "hold": 1.5, "dur": 14.75, "audio": "audio/cef55213c56c1821.mp3"}, {"say": "IBM's overview calls audit logging fully managed. So before you promise an auditor a record of who touched the vault, check that you can see the events from your own account.", "hold": 1.0, "dur": 8.72, "audio": "audio/10b8e1787066127e.mp3"}, {"slide": {"type": "tip", "head": "Two more things to check", "tip": "Allow time for a delete, and look for leftover keys."}, "say": "Watch for this. Allow time for a vault delete: one was accepted and still showed deleting at least six days later. And after a failed create, look for keys left behind. One left two keys on the COS instance.", "do": [["show", "head"], ["show", "tip"]], "hold": 2.0, "dur": 12.2, "audio": "audio/dc281662327714ce.mp3"}]}, {"title": "Check yourself", "cues": [{"slide": {"type": "statement", "head": "Three quick questions"}, "say": "Now three quick questions to check what you've learned.", "do": [["show", "head"]], "hold": 0.6, "dur": 2.92, "audio": "audio/6751b89b1110a0d2.mp3"}, {"slide": {"type": "q", "check": true, "head": "Which phrase is right for this vault?", "opts": ["Physical air gap", "Logical isolation", "Cut off from every network"], "ok": 1, "why": "The allowed network got HTTP 200, and everyone else was refused."}, "say": "First, which phrase is right for this vault?", "do": [["ask"]], "dur": 2.4, "audio": "audio/56660431faf09e98.mp3"}, {"say": "Logical isolation. The allowed network reached the vault and got HTTP 200, and everyone else was refused.", "do": [["why"]], "hold": 1.5, "dur": 7.47, "audio": "audio/2e15abe47b5ba561.mp3"}, {"slide": {"type": "q", "check": true, "head": "What does an account need to create a vault?", "opts": ["A role alone", "Roles and IBM's allow-list", "A physical connection"], "ok": 1, "why": "A list needs only a role; only a create shows you're allowed."}, "say": "Second, what does an account need before it can create a vault?", "do": [["ask"]], "dur": 3.32, "audio": "audio/79a66e6877e76222.mp3"}, {"say": "It needs IBM's allow-list as well as the roles. Only a create shows whether IBM has allowed the account.", "do": [["why"]], "hold": 1.5, "dur": 5.62, "audio": "audio/1f31b72ccf6dc906.mp3"}, {"slide": {"type": "q", "check": true, "head": "Is this vault the Deployable Architecture?", "opts": ["Yes, the same product", "No, a different product", "Yes, an older version"], "ok": 1, "why": "The vault is a managed COS feature; the architecture is a separate product."}, "say": "And third, is this vault the Deployable Architecture called COS Cyber Vault for Storage Defender?", "do": [["ask"]], "dur": 5.32, "audio": "audio/b062055a20a80197.mp3"}, {"say": "No. The vault is a managed COS feature, and the Deployable Architecture is a separate product. The next module puts them side by side.", "do": [["why"]], "hold": 1.5, "dur": 7.8, "audio": "audio/9cc472f91859ec23.mp3"}]}, {"title": "Summary", "cues": [{"slide": {"type": "score"}, "say": "That's the module done. Here's your score.", "do": [["show", "head"]], "hold": 1.5, "dur": 2.5, "audio": "audio/09491c03af65ff4a.mp3"}, {"slide": {"type": "summary", "text": "The vault is \u003cem\u003elogically isolated\u003c/em\u003e, and it isn't a \u003cem\u003ephysical air gap.\u003c/em\u003e", "next": "Next: The vault and the Deployable Architecture are different products", "sketch": "sum"}, "say": "If you remember one thing, make it this. The vault is logically isolated by network rules and locks, and it isn't a physical air gap.", "do": [["show", "head"], ["build", [0, 1]]], "hold": 1.5, "dur": 7.2, "audio": "audio/e15c454603784333.mp3"}, {"say": "In the next module, you'll see how to tell the vault apart from the Deployable Architecture.", "do": [["show", "next"]], "hold": 1.0, "dur": 4.55, "audio": "audio/1b044ebc9c186f80.mp3"}]}], "courseSlug": "vault", "moduleIndex": 4, "moduleTotal": 5, "nextHref": "m1-u4-two-products-one-name.html"};</script>
