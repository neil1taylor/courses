<script>window.TIMELINE = {"course": "Client-to-site VPN and certificate revocation", "section": "Reach a VPC with a VPN", "title": "Connect administrators to a VPC with a client-to-site VPN", "unit": "m1-u1-how-a-client-to-site-vpn-reaches-a-vpc.html", "sketches": {"title": {"w": 490, "h": 200, "shapes": [{"box": [10, 70, 120, 56], "title": "Laptop"}, {"line": [134, 98, 190, 98], "arrow": true}, {"box": [190, 10, 300, 180], "heavy": true}, {"text": "VPC", "at": [204, 36], "hand": true}, {"box": [200, 70, 100, 56], "title": "VPN server"}, {"line": [304, 98, 318, 98], "arrow": true}, {"box": [318, 70, 160, 56], "title": "Private server"}]}, "parts": {"w": 900, "h": 360, "shapes": [{"box": [10, 130, 150, 70], "title": "Laptop"}, {"line": [164, 165, 260, 165], "arrow": true}, {"box": [260, 110, 220, 110], "heavy": true, "title": "VPN server"}, {"box": [260, 260, 220, 70], "title": "Client IP pool"}, {"line": [370, 224, 370, 260], "arrow": true}, {"line": [484, 165, 580, 165], "arrow": true}, {"box": [580, 110, 200, 110], "title": "VPN route"}, {"line": [680, 224, 680, 260], "arrow": true}, {"box": [580, 260, 300, 70], "title": "Private servers"}]}, "summary": {"w": 350, "h": 200, "shapes": [{"box": [5, 70, 90, 50], "title": "Laptop"}, {"line": [98, 95, 122, 95], "arrow": true}, {"box": [122, 60, 120, 70], "heavy": true, "title": "VPN server"}, {"line": [246, 95, 262, 95], "arrow": true}, {"box": [262, 70, 80, 50], "title": "Server"}]}}, "steps": [{"title": "Welcome", "cues": [{"slide": {"type": "title", "head": "Connect administrators to a VPC with a client-to-site VPN", "sub": "From laptop to private server", "sketch": "title"}, "say": "Welcome.", "do": [["show", "head"], ["show", "sub"]], "hold": 0.6, "dur": 0.72, "audio": "audio/df38982f253a18a2.mp3"}, {"say": "Northgate Freight is a made-up haulier moving its vSphere estate to IBM Cloud. Its administrators work from laptops and need a way into the production VPC without opening every server to the internet.", "do": [["build", [0, 1, 2, 3, 4, 5, 6]]], "hold": 1.0, "dur": 11.85, "audio": "audio/c85796df5ce6beb1.mp3"}, {"say": "By the end of this module, you'll be able to describe what a VPN server, a client IP pool and a VPN route each do, and distinguish when to use a client-to-site VPN, a bastion host or a site-to-site VPN.", "dur": 13.85, "audio": "audio/60b8a54e1770bdb3.mp3"}, {"say": "You'll also be able to predict which source address a private server sees, and identify where to look when a connected laptop reaches nothing.", "hold": 1.2, "dur": 7.8, "audio": "audio/e404606d032b5ef7.mp3"}]}, {"title": "Four words", "cues": [{"slide": {"type": "words", "head": "Four words used in this module", "items": [["VPN server", "accepts OpenVPN connections from individual clients"], ["client IP pool", "the range the server hands out to connected clients"], ["VPN route", "says where traffic for a destination goes"], ["split tunnel", "sends only the VPC's traffic through the VPN"]]}, "say": "Four words come up in this module.", "do": [["show", "head"]], "hold": 0.6, "dur": 2.02, "audio": "audio/74d9d9046e10afd6.mp3"}, {"say": "A VPN server accepts OpenVPN connections from individual clients.", "do": [["items", [0]]], "hold": 0.6, "dur": 4.57, "audio": "audio/c84ee08fa4bb0125.mp3"}, {"say": "The client IP pool is the range the server hands out to connected clients.", "do": [["items", [1]]], "hold": 0.6, "dur": 4.67, "audio": "audio/929cf2807d6bad19.mp3"}, {"say": "A VPN route says where traffic for a destination goes.", "do": [["items", [2]]], "hold": 0.6, "dur": 3.67, "audio": "audio/83c794851d080a4f.mp3"}, {"say": "And a split tunnel sends only the VPC's traffic through the VPN.", "do": [["items", [3]]], "hold": 1.2, "dur": 4.02, "audio": "audio/bcb8bafbf05aaf9d.mp3"}]}, {"title": "The parts", "cues": [{"slide": {"type": "diagram", "head": "Traffic enters the VPN server and follows a route", "sketch": "parts"}, "say": "Here's how they fit together.", "do": [["show", "head"]], "hold": 0.6, "dur": 1.7, "audio": "audio/103cbb879009b769.mp3"}, {"say": "The laptop connects to the VPN server. IBM says the server can authenticate a client by certificate, by user ID and passcode, or both, and that its default port is 443 and its default protocol is UDP.", "do": [["build", [0, 1, 2]]], "hold": 0.8, "dur": 14.87, "audio": "audio/992ed17d3e362375.mp3"}, {"say": "The server hands each connected laptop an address from its client IP pool. IBM says the pool must not overlap any address prefix of the VPC, and its prefix length is between slash 9 and slash 22.", "do": [["build", [3, 4]]], "hold": 0.8, "dur": 13.1, "audio": "audio/89a919d713a0ef52.mp3"}, {"say": "A VPN route then says where the laptop's traffic goes. With the action deliver, the route sends it into the VPC, here to the range 10.20.0.0 slash 16. IBM says traffic that matches no route is dropped.", "do": [["build", [5, 6, 7, 8]]], "hold": 1.0, "dur": 14.55, "audio": "audio/c483c39d2d3c6dc4.mp3"}, {"say": "The VPN server also has a security group, which allows UDP 443 in and everything out, because a new group allows nothing out.", "hold": 1.2, "dur": 9.17, "audio": "audio/5b83f6a56dac2804.mp3"}]}, {"title": "Split tunnel", "cues": [{"slide": {"type": "tip", "head": "Turn on the split tunnel", "tip": "Otherwise the client's default route goes into the tunnel"}, "say": "One setting is easy to forget.", "do": [["show", "head"]], "hold": 0.6, "dur": 2.15, "audio": "audio/3fcec2596664b54f.mp3"}, {"say": "The split tunnel is off by default. Without it, the client's default route goes into the tunnel, and we lost our SSH session to the client, a lab server.", "do": [["show", "tip"]], "hold": 2.0, "dur": 8.7, "audio": "audio/8067f61a702b0068.mp3"}]}, {"title": "Three ways in", "cues": [{"slide": {"type": "table", "head": "Three ways to reach private servers", "cols": ["way in", "suits"], "rows": [["client-to-site VPN", "many administrators, a whole range"], ["bastion host", "a few servers, one SSH hop"], ["site-to-site VPN", "a whole site, not a person"]]}, "say": "There are three ways in, and a client-to-site VPN is only one of them.", "do": [["show", "head"], ["show", "table"]], "hold": 0.6, "dur": 4.17, "audio": "audio/92b826e1428fffc0.mp3"}, {"say": "A client-to-site VPN suits many administrators who each need a whole VPC range from a laptop. It needs certificates and a client program.", "do": [["row", 0]], "hold": 1.0, "dur": 8.32, "audio": "audio/7ef59c3bc583080a.mp3"}, {"say": "A bastion host suits a few servers, and it gives you one SSH hop.", "do": [["row", 1]], "hold": 0.8, "dur": 4.12, "audio": "audio/2eab0a97467eda09.mp3"}, {"say": "A site-to-site VPN joins a whole site to the VPC, not a person.", "do": [["row", 2]], "hold": 1.2, "dur": 4.52, "audio": "audio/e9b4587d4072314a.mp3"}]}, {"title": "Add a route and connect", "cues": [{"slide": {"type": "terminal", "cmd": "ibmcloud is vpn-server-route-create vpct-prod-vpnserver --vpc vpct-prod --destination 10.20.0.0/16 --action deliver --name vpct-prod-vpnserver-to-prod", "out": ["Name               vpct-prod-vpnserver-to-prod", "Action             deliver", "Destination        10.20.0.0/16", "Lifecycle state    pending"]}, "say": "To add the route, we run this command.", "hold": 0.6, "dur": 2.07, "audio": "audio/83513aa0d184d24a.mp3"}, {"say": "It names the server, the destination range and the action deliver.", "do": [["line", 1], ["line", 2]], "hold": 1.0, "dur": 3.77, "audio": "audio/876eb2e46d28a184.mp3"}, {"say": "The route table of the VPC also has to accept routes from the VPN server.", "hold": 1.0, "dur": 4.87, "audio": "audio/972de1c16ffb2d55.mp3"}, {"say": "Next, the laptop connects with an OpenVPN profile that you download from the server. The profile doesn't end with a newline, so add one before you add the client certificate.", "hold": 1.0, "dur": 9.27, "audio": "audio/92b41396d3be2bf1.mp3"}, {"slide": {"type": "terminal", "cmd": "ip -4 addr show tun0; ip route | grep tun0", "out": ["3: tun0    inet 172.16.0.130/25 brd 172.16.0.255 scope global tun0", "10.20.0.0/16 via 172.16.0.129 dev tun0 metric 200", "172.16.0.0/22 via 172.16.0.129 dev tun0 metric 200", "172.16.0.128/25 dev tun0 proto kernel scope link src 172.16.0.130"]}, "say": "Once it's up, we check the laptop's address and routes.", "hold": 0.6, "dur": 3.15, "audio": "audio/ecd4afb386cd3d61.mp3"}, {"say": "The laptop got the address 172.16.0.130 from the pool, and the server pushed the route to 10.20.0.0 slash 16.", "do": [["line", 0], ["line", 1]], "hold": 1.2, "dur": 12.42, "audio": "audio/44f40c55ecd16f89.mp3"}]}, {"title": "What a private server sees", "cues": [{"slide": {"type": "q", "head": "With deliver, which source address does a private server see?", "opts": ["The pool address", "The VPC's address", "The home address"], "ok": 0, "why": "deliver leaves the pool address unchanged."}, "say": "The route's action is deliver. From a private server, which source address does a connection from the laptop show?", "do": [["show", "head"], ["show", "opts"], ["ask"]], "dur": 6.0, "audio": "audio/9bb130cfbe83c682.mp3"}, {"say": "The pool address. The action deliver doesn't change it. With the action translate, a private server sees an address of the VPN server's VPC instead, and its security groups have to allow that address.", "do": [["why"]], "hold": 1.5, "dur": 11.77, "audio": "audio/b2fa76268cee4793.mp3"}]}, {"title": "Connected, but nothing passes", "cues": [{"slide": {"type": "q", "head": "Tunnel up, SSH times out. Where first?", "opts": ["The client certificate", "Route and security rules", "The UDP 443 rule"], "ok": 1, "why": "The certificate and the port worked, or the tunnel wouldn't be up."}, "say": "The tunnel is up and OpenVPN says Initialization Sequence Completed, but SSH to a private server times out. Where do you look first?", "do": [["show", "head"], ["show", "opts"], ["ask"]], "dur": 7.8, "audio": "audio/19c4c97ec6ba4a9e.mp3"}, {"say": "At the route, the route table, and the target's security group and network ACL. The route may be missing, the route table may not accept the pool's routes, or a security group or network ACL may deny the pool. A network ACL needs a rule for each direction.", "do": [["why"]], "hold": 1.5, "dur": 15.55, "audio": "audio/f78315cb9cf1b326.mp3"}]}, {"title": "Check yourself", "cues": [{"slide": {"type": "statement", "head": "Three quick questions"}, "say": "Now, three quick questions.", "do": [["show", "head"]], "hold": 1.2, "dur": 2.15, "audio": "audio/677cc3ee9f50a30b.mp3"}, {"slide": {"type": "q", "head": "Which range can't the client pool overlap?", "opts": ["Only the server's subnet", "Any VPC address prefix", "A laptop's range"], "ok": 1, "why": "Any address prefix of the VPC, and the ranges IBM lists.", "check": true}, "say": "Which range must the client IP pool not overlap?", "do": [["show", "head"], ["show", "opts"], ["ask"]], "dur": 2.92, "audio": "audio/c88d3441f98964a5.mp3"}, {"say": "Any address prefix of the VPC. IBM also lists a few other ranges that the pool must avoid.", "do": [["why"]], "hold": 1.5, "dur": 5.67, "audio": "audio/a365c5dbb149de91.mp3"}, {"slide": {"type": "q", "head": "Which route action shows the VPC's address?", "opts": ["deliver", "translate", "drop"], "ok": 1, "why": "translate changes the source address.", "check": true}, "say": "A private server shows the VPC's address instead of the pool address. Which route action is set?", "do": [["show", "head"], ["show", "opts"], ["ask"]], "dur": 5.7, "audio": "audio/b2ef2c370299a66e.mp3"}, {"say": "The action translate. It changes the source address, while deliver leaves the pool address in place.", "do": [["why"]], "hold": 1.5, "dur": 5.6, "audio": "audio/46d82dbb845b9eeb.mp3"}, {"slide": {"type": "q", "head": "With the split tunnel off, what enters the tunnel?", "opts": ["Only VPC traffic", "The default route", "Only port 443"], "ok": 1, "why": "The default route, so all its traffic.", "check": true}, "say": "A laptop has the split tunnel off. What does it send into the tunnel?", "do": [["show", "head"], ["show", "opts"], ["ask"]], "dur": 4.07, "audio": "audio/7a8e7751201d89e2.mp3"}, {"say": "Its default route, so all of the laptop's traffic. A split tunnel sends only the VPC's traffic through the VPN.", "do": [["why"]], "hold": 1.5, "dur": 6.82, "audio": "audio/bc1e1bd8ca8e5835.mp3"}]}, {"title": "Summary", "cues": [{"slide": {"type": "score"}, "say": "Here's your score.", "do": [["show", "head"]], "hold": 1.0, "dur": 1.07, "audio": "audio/6ef313582e9ac6fd.mp3"}, {"slide": {"type": "summary", "text": "A connected laptop that reaches nothing is a \u003cem\u003eroute\u003c/em\u003e or \u003cem\u003erule\u003c/em\u003e problem.", "next": "Issue the certificates a VPN server needs", "sketch": "summary"}, "say": "In this module, you've seen that the VPN server hands each laptop a pool address and a route sends its traffic into the VPC, and that a client-to-site VPN suits many administrators, a bastion host a few servers, and a site-to-site VPN a whole site. You've also seen that with deliver a private server sees the pool address, and that a connected laptop that reaches nothing points to the route, the route table or the security rules.", "do": [["show", "head"], ["build", [0, 1, 2, 3, 4]]], "hold": 1.0, "dur": 25.24, "audio": "audio/719d40c033ee043f.mp3"}, {"say": "If you remember one thing, make it the sentence on the screen.", "do": [["show", "next"]], "hold": 1.2, "dur": 3.05, "audio": "audio/ec5f6ed5fb99f9a9.mp3"}]}], "courseSlug": "vpn", "moduleIndex": 1, "moduleTotal": 1, "nextHref": null};</script>
